name: Dev build cache
# Prebuilt dependencies (Engine, wgpu, bevy_ecs, rapier, ...) for Linux cloud
# sandboxes, so a fresh one downloads them in seconds instead of compiling
# them for six minutes. scripts/check.sh fetches the archive whose key matches
# the checkout (docs/CHECKS.md). Built only when the dependencies change.
# Arnd OK'd publishing it as a public release file (2026-11-09).
#
# The build runs as root in /home/user/HeroWorld with HOME=/root, exactly
# where a sandbox has them: cargo keys its build outputs by these paths. It
# runs with an empty environment, so no token or secret reaches the archive.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - scripts/dev-cache-key.sh
      - .github/workflows/dev-cache.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dev-cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Key
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(scripts/dev-cache-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if gh release view dev-cache --json assets -q '.assets[].name' 2>/dev/null | grep -qx "deps-$key.tar.zst"; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk
        if: steps.key.outputs.have == 'no'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the dependencies as a sandbox would
        if: steps.key.outputs.have == 'no'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libudev-dev zstd
          sudo mkdir -p /home/user
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/HeroWorld
          sudo env -i HOME=/root USER=root RUSTUP_HOME=/root/.rustup RUST_BACKTRACE=1 \
            PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash -euo pipefail -c '
              curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y -q --profile minimal --default-toolchain none
              cd /home/user/HeroWorld
              rustup toolchain install
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace --no-run
              # Keep only the dependencies: our own crates are rebuilt anyway.
              cargo clean -p hw-core -p hw-gen -p hw-net -p hw-sim -p hw-client -p dupcheck
              rm -rf target/debug/incremental target/debug/examples target/tmp
              tar -C /home/user/HeroWorld -cf - target | zstd -T0 -10 -q -o /tmp/deps.tar.zst
            '
          sudo chown "$(id -u)" /tmp/deps.tar.zst
          ls -l /tmp/deps.tar.zst
      - name: Publish
        if: steps.key.outputs.have == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="${{ steps.key.outputs.key }}"
          mv /tmp/deps.tar.zst "deps-$key.tar.zst"
          gh release view dev-cache >/dev/null 2>&1 ||
            gh release create dev-cache --title "Dev build cache" --prerelease --target "${{ github.sha }}" \
              --notes "Prebuilt dependencies for Linux cloud sandboxes (scripts/check.sh fetches them). Not a game build."
          gh release upload dev-cache "deps-$key.tar.zst" --clobber
          # Keep the newest four.
          gh api "repos/${{ github.repository }}/releases/tags/dev-cache" \
            -q '.assets | sort_by(.created_at) | reverse | .[4:] | .[].name' |
            while read -r old; do gh release delete-asset dev-cache "$old" --yes; done
