[package]
name = "hw-launcher"
description = "The HeroWorld launcher: installs and updates the game from GitHub, shows what's new, starts it. No Engine."
# The launcher has its own version: the nightly manifest names it, and a
# launcher older than that offers to update itself.
version = "1.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "HeroWorldLauncher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
self-replace = "1"

[build-dependencies]
winresource = "0.1"
