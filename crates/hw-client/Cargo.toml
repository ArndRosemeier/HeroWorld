[package]
name = "hw-client"
description = "The game client on Engine: rendering, input, camera, UI, prediction."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "heroworld"

[lints]
workspace = true

[[bin]]
name = "heroworld"
path = "src/main.rs"

[dependencies]
hw-core = { workspace = true }
hw-gen = { workspace = true }
hw-sim = { workspace = true }
hw-net = { workspace = true }
engine = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
actors-engine = { workspace = true }
actors-generator = { workspace = true }
actors-human = { workspace = true }
# Graffiti decals (PNG); the same image crate Engine uses.
image = { version = "0.25", default-features = false, features = ["png"] }
# Team voice: the microphone and speakers (the version rodio in Engine uses)
# and the Opus codec (libopus, built from source by opusic-sys: no cmake).
cpal = "0.16"
opus = "0.4"
