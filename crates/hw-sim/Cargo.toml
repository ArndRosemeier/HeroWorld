[package]
name = "hw-sim"
description = "The game server: simulation state, bubbles, incidents, combat, saves."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "hw-headless"
path = "src/bin/hw-headless.rs"

[dependencies]
hw-core = { workspace = true }
hw-gen = { workspace = true }
hw-net = { workspace = true }
bevy_ecs = { workspace = true }
glam = { workspace = true }
# Only for `engine::physics::PhysicsWorld`: physics without a window or GPU.
engine = { workspace = true }
serde_json = { workspace = true }
# The traffic step's kept threads (the same rayon Engine uses).
rayon = "1.10"

[dev-dependencies]
tungstenite = { workspace = true }
