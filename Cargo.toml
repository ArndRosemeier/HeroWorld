[workspace]
resolver = "2"
members = [
    "crates/hw-core",
    "crates/hw-gen",
    "crates/hw-sim",
    "crates/hw-net",
    "crates/hw-client",
    "crates/hw-launcher",
    "tools/dupcheck",
]
# The client pulls in Engine (wgpu, winit): leave it out of plain `cargo test`
# runs on machines without the system libraries; `cargo test --workspace` builds it.
default-members = [
    "crates/hw-core",
    "crates/hw-gen",
    "crates/hw-sim",
    "crates/hw-net",
    "crates/hw-launcher",
    "tools/dupcheck",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
hw-core = { path = "crates/hw-core" }
hw-gen = { path = "crates/hw-gen" }
hw-sim = { path = "crates/hw-sim" }
hw-net = { path = "crates/hw-net" }
engine = { git = "https://github.com/ArndRosemeier/Engine", branch = "main" }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
# Characters: the Rust port of Actors (pinned; bump the rev to follow it).
# actors-engine follows Engine main, so both resolve to the one Engine above.
actors-engine = { git = "https://github.com/ArndRosemeier/Actors", rev = "fc0eee7481e363e233c979926d6db10bc0d393ce" }
actors-generator = { git = "https://github.com/ArndRosemeier/Actors", rev = "fc0eee7481e363e233c979926d6db10bc0d393ce" }
actors-human = { git = "https://github.com/ArndRosemeier/Actors", rev = "fc0eee7481e363e233c979926d6db10bc0d393ce" }
glam = "0.33"
libm = "0.2"
# The GameHub lobby and relay: a WebSocket over TLS (ring, so Windows builds need no extra tools).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"

# Engine runs a patched wgpu 25 (render bundles are freed when dropped; unpatched
# they leak hundreds of MB a minute) and wgpu-core (bind groups skip rechecking
# every texture once all are initialized). A [patch] only applies in the workspace that
# declares it, so we take Engine's copies (third_party/wgpu-25.0.2, wgpu-core-25.0.2) the same way.
# Remove this when Engine drops its patch.
[patch.crates-io]
wgpu = { git = "https://github.com/ArndRosemeier/Engine", branch = "main" }
wgpu-core = { git = "https://github.com/ArndRosemeier/Engine", branch = "main" }

# Engine's generators and renderer crawl without optimisation; optimise
# dependencies in debug builds so the game stays playable while our own code
# builds quickly.
[profile.dev]
opt-level = 1
# Line numbers in our own backtraces, no full debug info: with it every test
# binary was 600-800 MB (30 of them filled a cloud sandbox's disk) and
# linking them took most of a test build.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
